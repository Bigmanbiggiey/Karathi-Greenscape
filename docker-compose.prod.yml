name: karathi

x-backend-image: &backend-image
  build:
    context: ./BackEnd
  image: karathi-backend

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - karathi_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: run schema migrations once, then exit. The web service waits for
  # this to complete, so scaling `backend` can never race migrations.
  migrate:
    <<: *backend-image
    # Override the image ENTRYPOINT (entrypoint.sh runs collectstatic + gunicorn
    # and ignores its args); this service must run migrate and then exit.
    entrypoint: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend-image
    restart: unless-stopped
    env_file: .env
    volumes:
      - karathi_media:/app/media
      - karathi_static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  nginx:
    build:
      context: ./ForePart
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    volumes:
      - karathi_media:/usr/share/nginx/media:ro
      - karathi_static:/usr/share/nginx/static:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default
      - server_backend

volumes:
  karathi_db_data:
  karathi_media:
  karathi_static:

networks:
  server_backend:
    external: true

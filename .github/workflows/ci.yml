name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BackEnd
    env:
      DJANGO_SECRET_KEY: ci-not-secret
      DJANGO_DEBUG: "true"
      DATABASE_URL: sqlite:///ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Migrations are complete (no model drift)
        run: python manage.py makemigrations --check --dry-run
      - name: Django system checks
        run: python manage.py check
      - name: Tests
        run: pytest -q || python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ForePart
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ForePart/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Audit (fail on high/critical)
        run: npm audit --audit-level=high
